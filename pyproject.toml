[project]
name = "tellybear"
version = "1.0.0"
description = "Self-hosted, parent-gated bedtime-story generator for young children"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5",          # bundled static ffmpeg, used when there is no system ffmpeg
    "bcrypt>=4.1,<5.0",             # password hashing for parent accounts
    "faster-whisper>=1.1,<2.0",     # speech-to-text for spoken story requests (CPU is fine)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]
# Variety guard: small CPU/ONNX embeddings that stop near-duplicate plots. Optional (some Python
# versions lack a wheel); without it the guard is a logged no-op. pip install -e '.[embed]'
embed = [
    "fastembed>=0.3,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tellybear*"]

[tool.setuptools.package-data]
"tellybear.safety" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
