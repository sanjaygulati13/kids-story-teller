; Tellybear firmware — M5Stack Cardputer ADV (StampS3A / ESP32-S3FN8, ES8311 audio, no PSRAM)
; Board specifics verified from M5Stack docs (docs.m5stack.com/en/core/Cardputer-Adv).
[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1        ; StampS3A → generic S3 devkit target (per M5 ADV guide)
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps =
    ; Pinned to the versions verified on hardware. M5Cardputer's own deps are unpinned (*),
    ; and patch_m5unified.py edits M5Unified source, so pin the whole chain explicitly.
    m5stack/M5Cardputer @ 1.1.1    ; ADV audio+keyboard driver
    m5stack/M5Unified @ 0.2.17
    https://github.com/m5stack/M5GFX.git#0.2.24   ; 0.2.24 is no longer in the PIO registry
    z3t0/IRremote @ 4.7.1
    earlephilhower/ESP8266Audio @ 1.9.7
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=3
; Pre-build: enlarge M5Unified's undersized mic_task stack (see patch_m5unified.py).
extra_scripts =
    pre:patch_m5unified.py
